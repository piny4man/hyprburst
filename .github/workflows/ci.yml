name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # The opt-in profiling build (docs/hotpath-profiling.md) must keep
      # compiling, and its report must keep naming every instrumented phase.
      - name: Clippy (hotpath-alloc)
        run: cargo clippy --all-targets --features hotpath-alloc -- -D warnings

      - name: Tests (hotpath)
        run: cargo test --all-targets --features hotpath

      - name: Tests (hotpath-alloc)
        run: cargo test --all-targets --features hotpath-alloc
