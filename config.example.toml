# Hyprburst config — copy to ~/.config/hyprburst/config.toml (or $XDG_CONFIG_HOME/hyprburst/config.toml)
# Every field is optional; omitted keys fall back to the built-in defaults.
# Unknown keys are rejected so typos surface loudly instead of being silently ignored.
#
# NOTE: the [terminal] section was removed in hyprburst 0.5 — the launcher now
# opens its own window instead of re-execing a terminal. A config that still
# contains [terminal] is rejected; move `terminal.class` to `window.app_id` and
# delete the rest.

# Colors accept either a named color or a 6-digit hex string ("#RRGGBB").
#
# Named colors (case-insensitive, dashes/underscores ignored):
#   black, red, green, yellow, blue, magenta, cyan, white,
#   gray / grey, darkgray / darkgrey,
#   light-red, light-green, light-yellow, light-blue, light-magenta, light-cyan,
#   reset (falls back to your terminal's default foreground)
[colors]
# banner     = "magenta"    # ASCII banner
# prompt     = "cyan"       # search prompt + cursor
# selected   = "yellow"     # highlighted entry in the result list
# empty      = "yellow"     # "no matches" message
# background = "#121218"    # window background (only when window.transparent = false)
# foreground = "#dcdcdc"    # default text color for unstyled (Reset) text

# Hex example — pick your own palette:
# banner   = "#ff79c6"
# prompt   = "#8be9fd"
# selected = "#f1fa8c"
# empty    = "#6272a4"

# The launcher window: its Wayland app-id (matched by the Hyprland windowrules),
# initial size, and transparency. All keys are optional.
[window]
# Wayland app-id. The shipped windowrules match `^(hyprburst)$`; change both
# together if you customize this. Must be non-empty.
# app_id = "hyprburst"

# Initial window size in logical pixels. The overlay windowrule resizes it to
# the monitor anyway; these are the pre-rule defaults. Must be >= 1.
# width = 640
# height = 720

# Keep the surface transparent so Hyprland's blur shows through. Set to false to
# paint an opaque colors.background instead (no blur).
# transparent = true

# The cell font the window rasterizes glyphs from.
[font]
# Explicit .ttf/.otf path. When unset, the system monospace (fc-match) is used,
# and $HYPRBURST_FONT overrides that. Point this at a Nerd Font to guarantee the
# entry icons render instead of tofu.
# path = "/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf"

# Logical font height in pixels before DPI scaling. Must be > 0.
# size = 16.0

# Layout knobs controlling mode, padding, banner centring, and separator line.
# Defaults use list mode with modest padding, a left-aligned banner, and no
# separator. Values out of range fall back to defaults with a warning.
[layout]
# Render mode: "list" (one entry per row) or "grid" (entries flow across
# auto-fit columns). Defaults to "list". Unknown values are rejected.
# mode = "list"

# Minimum column width in cells. Used only when mode = "grid"; column count is
# max(1, list_width / min_column_width). Must be >= 1. Narrow terminals
# collapse to a single column automatically.
# min_column_width = 20

# Horizontal padding applied to both left and right edges. Capped at 32;
# values above the cap fall back to the default of 4.
# padding_horizontal = 4

# Vertical padding applied to both top and bottom edges. Capped at 32. Set both
# padding values to 0 for the densest layout.
# padding_vertical = 2

# Centre the banner horizontally within the padded area.
# center_banner = false

# Draw a single-row separator line between the prompt and the result list.
# separator = false

# UI chrome — banner, prompt, paging, icons, selection marker, and cursor glyph.
# Invalid values (multi-char cursor_char, empty selected_marker) print a stderr
# warning and fall back to defaults (page_size = 0 is a hard error).
[ui]
# Multi-line ASCII banner shown above the prompt. Use a TOML multi-line string
# ("""...""") to preserve newlines. Set to "" to hide the banner.
# banner = """
#  _                      _                    _
# | |__  _   _ _ __  _ __| |__  _   _ _ __ ___| |_
# | '_ \| | | | '_ \| '__| '_ \| | | | '__/ __| __|
# | | | | |_| | |_) | |  | |_) | |_| | |  \__ \ |_
# |_| |_|\__, | .__/|_|  |_.__/ \__,_|_|  |___/\__|
#        |___/|_|
# """

# String printed before the search cursor.
# prompt = "> "

# Number of entries shown per page (PageUp/PageDown step size). Must be >= 1.
# page_size = 10

# Show Nerd Font icons before each app name. Set to false if your font lacks
# Nerd glyphs to avoid tofu squares.
# show_icons = true

# Prefix drawn on the selected row. Unselected rows get matching spaces so
# icons stay aligned. Must not be empty.
# selected_marker = "> "

# Single-character cursor glyph drawn after the prompt. Multi-char values are
# rejected with a warning.
# cursor_char = "█"

# Draw the cursor glyph at all. Set to false for a cursor-less prompt.
# show_cursor = true
