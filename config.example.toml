# Burst config — copy to ~/.config/burst/config.toml (or $XDG_CONFIG_HOME/burst/config.toml)
# Every field is optional; omitted keys fall back to the built-in defaults.
# Unknown keys are rejected so typos surface loudly instead of being silently ignored.

# Multi-line ASCII banner shown above the prompt. Use a TOML multi-line string ("""...""")
# to preserve newlines. Set to "" to hide the banner.
# banner = """
#  _                    _
# | |__  _   _ _ __ ___| |_
# | '_ \| | | | '__/ __| __|
# | |_) | |_| | |  \__ \ |_
# |_.__/ \__,_|_|  |___/\__|
# """

# String printed before the search cursor.
# prompt = "> "

# Number of entries shown per page (PageUp/PageDown step size). Must be >= 1.
# page_size = 10

# Colors accept either a named color or a 6-digit hex string ("#RRGGBB").
#
# Named colors (case-insensitive, dashes/underscores ignored):
#   black, red, green, yellow, blue, magenta, cyan, white,
#   gray / grey, darkgray / darkgrey,
#   light-red, light-green, light-yellow, light-blue, light-magenta, light-cyan,
#   reset (falls back to your terminal's default foreground)
[colors]
# banner   = "magenta"    # ASCII banner
# prompt   = "cyan"       # search prompt + cursor
# selected = "yellow"     # highlighted entry in the result list
# empty    = "yellow"     # "no matches" message

# Hex example — pick your own palette:
# banner   = "#ff79c6"
# prompt   = "#8be9fd"
# selected = "#f1fa8c"
# empty    = "#6272a4"

# Terminal emulator burst should re-exec into when launched headlessly
# (e.g. via Hyprland bind). All keys are optional.
#
# Resolution order (first match on PATH wins):
#   1. [terminal.preferred] (this list, in order)
#   2. $TERMINAL
#   3. $TERM, then $TERM_PROGRAM
#   4. x-terminal-emulator (symlink resolved to its real target)
#   5. Built-in chain: alacritty, wezterm, ghostty, kitty, foot, rio
[terminal]
# Ordered list of preferred terminal binaries. First one found on PATH wins.
# preferred = ["rio", "ghostty"]

# Window class / app-id passed to the terminal so Hyprland windowrules can
# match (e.g. `windowrule = float, class:^(burst)$`). Defaults to "burst".
# class = "burst"

# Per-terminal argv templates. Override a built-in entry or add a new one for
# a terminal burst doesn't know about. `{class}` and `{cmd}` are substituted
# at launch time. The template MUST contain `{cmd}` (the burst binary) — if it
# doesn't, burst prints a warning to stderr and falls back to the built-in
# default.
#
# Built-in defaults (override only if your terminal needs different flags):
#   alacritty = ["--class={class}", "-e", "{cmd}"]
#   wezterm   = ["start", "--class={class}", "--", "{cmd}"]
#   ghostty   = ["--class={class}", "-e", "{cmd}"]
#   kitty     = ["--class={class}", "{cmd}"]
#   foot      = ["--app-id={class}", "{cmd}"]
#   rio       = ["--title={class}", "-e", "{cmd}"]
#
# [terminal.flags.cosmic-term]
# args = ["--class={class}", "-e", "{cmd}"]
