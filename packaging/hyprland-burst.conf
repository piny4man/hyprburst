# hyprland-burst.conf — drop-in Hyprland config for the burst launcher.
#
# Source this file from your ~/.config/hypr/hyprland.conf:
#
#     source = ~/.config/hypr/hyprland-burst.conf
#
# Requires Hyprland 0.48+ (unified `windowrule`; `windowrulev2` is deprecated).

# Fullscreen overlay + semi-transparent blur for burst.
windowrule = match:class ^(burst)$, float on
windowrule = match:class ^(burst)$, size 100% 100%
windowrule = match:class ^(burst)$, center on
windowrule = match:class ^(burst)$, opacity 0.9 0.8
windowrule = match:class ^(burst)$, border_size 0
windowrule = match:class ^(burst)$, no_shadow on
windowrule = match:class ^(burst)$, stay_focused on
windowrule = match:class ^(burst)$, dim_around on

# Bind Super+Space to `burst launch`, which resolves the user's terminal
# and re-execs burst inside it with the right --class / --app-id flag so
# the windowrules above match.
bind = SUPER, Space, exec, burst launch

# Optionally pin a specific terminal for burst by exporting $TERMINAL to
# Hyprland. $TERMINAL is the only environment variable burst respects in
# v1 — everything else lives in ~/.config/burst/config.toml.
# env = TERMINAL,rio
