# hyprburst.conf — legacy hyprlang (.conf) drop-in Hyprland config for the
# hyprburst launcher.
#
# Source this file from your ~/.config/hypr/hyprland.conf:
#
#     source = ~/.config/hypr/hyprburst.conf
#
# Requires Hyprland 0.48-0.54 (unified `windowrule`; `windowrulev2` is
# deprecated). On Hyprland 0.55+ with a Lua config (~/.config/hypr/hyprland.lua),
# use packaging/hyprburst.lua instead. Lua users configure placement and opacity
# in ~/.config/hyprburst/config.toml.

# Fullscreen overlay + semi-transparent blur for hyprburst.
windowrule = match:class ^(hyprburst)$, float on
windowrule = match:class ^(hyprburst)$, pin on
windowrule = match:class ^(hyprburst)$, size (monitor_w) (monitor_h)
windowrule = match:class ^(hyprburst)$, move 0 0
windowrule = match:class ^(hyprburst)$, opacity 0.9 0.9
windowrule = match:class ^(hyprburst)$, border_size 0
windowrule = match:class ^(hyprburst)$, no_shadow on
windowrule = match:class ^(hyprburst)$, stay_focused on
windowrule = match:class ^(hyprburst)$, dim_around on

# Bind Super+Space to `hyprburst`. The bare binary opens the launcher window
# directly — it owns its own Wayland surface (app-id `hyprburst`) so the
# windowrules above match. Use `hyprburst tui` to run inline in a terminal.
bind = SUPER, Space, exec, hyprburst
