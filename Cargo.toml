[package]
name = "hyprburst"
version = "0.4.3"
edition = "2024"
description = "Fast fullscreen terminal application launcher for Arch Linux and Hyprland"
license = "GPL-3.0-or-later"
repository = "https://github.com/piny4man/hyprburst"
readme = "README.md"
keywords = ["launcher", "hyprland", "tui", "arch-linux", "desktop"]
categories = ["command-line-utilities", "gui"]
include = [
    "CHANGELOG.md",
    "Cargo.lock",
    "Cargo.toml",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "MAINTAINERS.md",
    "README.md",
    "SECURITY.md",
    "config.example.toml",
    "packaging/hyprburst.conf",
    "src/**",
    "tests/**",
]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tachyonfx = "0.25"

# Freya bake-off spike (experiment branch only). Gated behind the optional
# `freya-spike` feature so the default build, shipped binary, CI, and crates.io
# packaging stay byte-for-byte unaffected — Freya and its Skia/PTY stack are
# compiled only when the feature is explicitly enabled. The `terminal` feature
# pulls Freya's PTY-backed terminal component (`freya-terminal`), which the
# Phase 5 embedded-terminal POC hosts; `winit` (default) backs the window.
freya = { version = "0.4.0-rc.21", optional = true, features = ["terminal"] }
# Same Skia/PTY spike. `alacritty_terminal` is already pulled transitively by
# `freya-terminal`; depending on it directly (still optional, still gated) lets
# the Phase 5 harness model the embedded-terminal frame cost headlessly — parse
# the launcher's rendered VT bytes through the same emulator Freya hosts —
# without growing the `Cargo.lock` union or touching the default build.
alacritty_terminal = { version = "0.26", optional = true }
# Same Skia spike. The `image` crate is already pulled transitively by Freya's
# Skia/asset stack; depending on it directly (still optional, still gated) lets
# the Phase 6 harness model the themed-icon path's decode cost headlessly —
# decode real PNG bytes to RGBA, the work Freya's `ImageViewer` does on Skia —
# without growing the `Cargo.lock` union or touching the default build. Only the
# PNG codec is needed for the synthetic benchmark icons.
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
] }
# Same Skia spike. `freya-winit` is the windowing backend Freya already pulls;
# depending on it directly (still optional, still gated) gives access to its
# plugin API so the POCs can stamp an *honest* cold-start at the first real frame
# present (`AfterPresenting`) instead of the first component render, which fires
# well before Skia paints and the compositor shows the window. Zero new packages.
freya-winit = { version = "0.4.0-rc.21", optional = true }

[features]
# Off by default. Enables the Freya POC binaries and their dependency stack.
freya-spike = ["dep:freya", "dep:alacritty_terminal", "dep:image", "dep:freya-winit"]

# Thin Phase 3 viability probe — grows into the real native-GUI POC in Phase 4.
# Gated so it is never built (and Freya is never pulled) without the feature.
[[bin]]
name = "hyprburst-spike-gui"
path = "src/bin/hyprburst-spike-gui.rs"
required-features = ["freya-spike"]

# Phase 5 embedded-terminal POC: a Freya window hosting a PTY that runs
# `hyprburst tui`. Same feature gate, so neither the default build nor crates.io
# packaging ever pulls Freya for it.
[[bin]]
name = "hyprburst-spike-term"
path = "src/bin/hyprburst-spike-term.rs"
required-features = ["freya-spike"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
