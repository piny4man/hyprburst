[package]
name = "hyprburst"
version = "0.4.3"
edition = "2024"
description = "Fast fullscreen terminal application launcher for Arch Linux and Hyprland"
license = "GPL-3.0-or-later"
repository = "https://github.com/piny4man/hyprburst"
readme = "README.md"
keywords = ["launcher", "hyprland", "tui", "arch-linux", "desktop"]
categories = ["command-line-utilities", "gui"]
include = [
    "CHANGELOG.md",
    "Cargo.lock",
    "Cargo.toml",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "MAINTAINERS.md",
    "README.md",
    "SECURITY.md",
    "config.example.toml",
    "packaging/**",
    "src/**",
    "tests/**",
]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tachyonfx = "0.25"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
