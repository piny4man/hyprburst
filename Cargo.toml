[package]
name = "hyprburst"
version = "0.7.0"
edition = "2024"
description = "Fast fullscreen GPU-rendered application launcher for Arch Linux and Hyprland"
license = "GPL-3.0-or-later"
repository = "https://github.com/piny4man/hyprburst"
readme = "README.md"
keywords = ["launcher", "hyprland", "tui", "arch-linux", "desktop"]
categories = ["command-line-utilities", "gui"]
include = [
  "CHANGELOG.md",
  "Cargo.lock",
  "Cargo.toml",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "docs/**",
  "LICENSE",
  "MAINTAINERS.md",
  "README.md",
  "SECURITY.md",
  "config.example.toml",
  "packaging/hyprburst.conf",
  "packaging/hyprburst.lua",
  "src/**",
  "tests/**",
]

[dependencies]
ratatui = "0.30"
# crossterm backs the `hyprburst tui` fallback (inline launcher for SSH / no-GPU).
crossterm = "0.29"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tachyonfx = "0.25"
rio-vt = "0.5.1"
teletypewriter = "0.5.1"
corcovado = "0.5.1"

# The windowed launcher owns its Wayland surface and uses a hand-written GL cell
# renderer. The default frontend paints a rio-vt grid; `hyprburst native` paints
# `render_core`'s ratatui Buffer directly. winit drives the event loop;
# glutin/glutin-winit create the GL context/surface; glow is the GL binding;
# ab_glyph rasterizes glyphs; raw-window-handle bridges winit ↔ glutin.
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.16"
ab_glyph = "0.2"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
